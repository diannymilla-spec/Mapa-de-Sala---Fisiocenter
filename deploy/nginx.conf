# Server block de exemplo pra VPS. Ajuste server_name, root e a versão do
# PHP-FPM socket (verifique com `ls /run/php/` qual arquivo existe no seu
# servidor — a versão no nome muda conforme a versão do PHP instalada).

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_OU_IP;

    root /var/www/mapa-de-sala;
    index index.html;

    # Arquivos estáticos (mesmo webroot do projeto)
    location / {
        try_files $uri $uri/ =404;
    }

    # Nunca deixa o .env (nem outros arquivos de config/segredo) ser servido
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    # PHP-FPM só para /api/*.php — resto do projeto é estático
    location ~ ^/api/.+\.php$ {
        include snippets/fastcgi-php.conf;
        # Ajuste a versão conforme `php -v` / o que existir em /run/php/
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        return 404;
    }
}

# Depois de confirmar que está tudo funcionando em HTTP, rode:
#   sudo certbot --nginx -d SEU_DOMINIO
# pra emitir HTTPS automaticamente (Let's Encrypt) e redirecionar HTTP->HTTPS.
